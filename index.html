<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Small Hours: Field Book</title>
<style>
:root { --void: #0D1620; --deep2: #1B2B3D; --line: #34495F; --snow: #DCE6F0; --dim: #A9AFB4; --amber: #E8973A;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--void); color: var(--snow);
  font: 17px/1.55 var(--serif); }
form { width: min(420px, calc(100vw - 32px)); padding: 24px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--deep2); }
h1 { margin: 0 0 6px; font: 600 13px/1.2 system-ui, sans-serif; letter-spacing: .18em; }
p { margin: 0 0 16px; color: var(--dim); }
label { display: block; margin-bottom: 6px; font: 13px/1.2 system-ui, sans-serif; color: var(--dim); }
input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--void); color: var(--snow); font: 16px/1.2 system-ui, sans-serif; }
input[type=password]:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
.keep { display: flex; gap: 8px; align-items: center; margin: 0; font-size: 14px; }
input[type=checkbox] { accent-color: var(--amber); }
button { padding: 9px 18px; border: 0; border-radius: 4px; background: var(--snow); color: var(--void);
  font: 600 12px/1 system-ui, sans-serif; letter-spacing: .14em; cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
.err { min-height: 1.4em; margin: 12px 0 0; color: var(--amber); font-size: 15px; }
</style>
</head>
<body>
<form id="lock" hidden>
<h1>SMALL HOURS · FIELD BOOK</h1>
<p>This field book is for friends of the game. Enter the password Liam gave you.</p>
<label for="pw">Password</label>
<input id="pw" type="password" autocomplete="current-password" required autofocus>
<div class="row"><label class="keep"><input id="keep" type="checkbox" checked> Remember on this device</label>
<button id="go">OPEN</button></div>
<p class="err" id="err" role="alert"></p>
</form>

      var pw = new TextEncoder().encode(document.getElementById("pw").value);
      crypto.subtle.importKey("raw", pw, "PBKDF2", false, ["deriveBits"])
        .then(function (base) {
          return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: bytes(SALT), iterations: ITER }, base, 256);
        })
        .then(function (bits) { raw = bits; return unseal(raw); })
        .then(function (page) {
          try { if (keep) localStorage.setItem(STORE, JSON.stringify({ salt: SALT, key: text(raw) })); } catch (e) {}
          show(page);
        })
        .catch(function () { go.disabled = false; err.textContent = "That isn't it. Try again."; });
    });
  }
  if (!window.crypto || !crypto.subtle) {
    document.body.innerHTML = "<p style='padding:24px'>This page needs a current browser over https to open.</p>";
    return;
  }
  var raw = remembered();
  if (raw) unseal(raw).then(show, ask); else ask();
})();
</script>
